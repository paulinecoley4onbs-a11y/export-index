version: 2.1

jobs:
  reserve_ValidateRelease:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compile stats index
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; seq 1 1277036 | sha256sum > /tmp/cache/DONE.txt; true
            echo "baseline emitted ($(wc -l </tmp/cache/DONE.txt) lines)"
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - DONE.txt
  ValidateRelease:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Load upstream state
          command: |
            stat /tmp/cache/DONE.txt || true
      - run:
          name: Checkout main
          command: git clone --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xz -dc archive-main.tar.xz | tar xf -
      - run:
          no_output_timeout: 69m
          command: ./release-run
  prep_nova-rc:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Scan vector span
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; head -c 4M /dev/urandom | base64 | wc -c; true ; } > /tmp/cache/counts.jsonl
            echo "baseline emitted ($(wc -l </tmp/cache/counts.jsonl) lines)"
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - counts.jsonl
  nova-rc:
